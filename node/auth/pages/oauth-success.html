<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>授权成功</title>
  <style>
    :root {
      color: #17201c;
      background: #f5f8f6;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 280px;
      min-height: 100svh;
      margin: 0;
      background: #f5f8f6;
    }

    main {
      width: min(100%, 480px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .brand {
      color: #4e5d55;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .result {
      align-self: center;
      text-align: center;
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid #7fc6a0;
      border-radius: 50%;
      background: #e8f6ee;
      animation: arrive 420ms ease-out both;
    }

    .mark::after {
      width: 17px;
      height: 32px;
      border: solid #167a49;
      border-width: 0 4px 4px 0;
      content: "";
      transform: translateY(-3px) rotate(45deg);
    }

    h1 {
      margin: 0;
      color: #17201c;
      font-size: 30px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .message {
      max-width: 320px;
      margin: 14px auto 0;
      color: #536159;
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0;
    }

    .progress {
      width: min(100%, 300px);
      margin: 38px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      position: relative;
    }

    .progress::before {
      height: 2px;
      position: absolute;
      top: 6px;
      right: 16.66%;
      left: 16.66%;
      background: #79bd98;
      content: "";
    }

    .step {
      color: #4e5d55;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0;
      position: relative;
    }

    .step::before {
      width: 14px;
      height: 14px;
      margin: 0 auto 9px;
      display: block;
      border: 3px solid #f5f8f6;
      border-radius: 50%;
      background: #208a57;
      box-shadow: 0 0 0 1px #79bd98;
      content: "";
      position: relative;
      z-index: 1;
    }

    footer {
      color: #7a8780;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0;
      text-align: center;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: scale(.82);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">DARLING.XIN</div>
    <section class="result" aria-labelledby="result-title">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="result-title">授权成功</h1>
      <p class="message">登录信息已发送到原设备。<br>可以关闭当前页面。</p>
      <div class="progress" aria-label="授权流程已完成">
        <span class="step">扫码</span>
        <span class="step">授权</span>
        <span class="step">完成</span>
      </div>
    </section>
    <footer>请返回原设备继续使用</footer>
  </main>
</body>
</html>
